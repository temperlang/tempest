# Temporary: Windows paths in the language server and the CLI, on each
# push to the transition branch, on every OS. Delete once green; the
# nightly's platform jobs run the same tests.
name: Debug

on:
  push:
    branches: [rfc-657-transition]

permissions:
  contents: read

jobs:
  paths:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Line ends as committed
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@cfcaf53ba4c621917ec7f78a66bff7a8848ddad4 # 1.85.0 branch, 2026-10-16
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Path handling
        run: cargo test --locked -p temper-frontend --lib "project::"
      - name: Language server
        if: ${{ !cancelled() }}
        run: cargo test --locked -p temper-lsp
      - name: CLI, paths with spaces and Unicode
        if: ${{ !cancelled() }}
        run: cargo test --locked -p tempest --no-default-features --test cli paths_with_spaces_and_unicode
