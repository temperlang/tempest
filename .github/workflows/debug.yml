# Temporary: the Windows backend fixes (javac and csc argument files,
# C# analyzer config paths, CRLF output, Python UTF-8 mode, JS source
# maps and tsc), on each push to the transition branch. Delete once
# green; the nightly's platform jobs run the same tests.
name: Windows debug

on:
  push:
    branches: [rfc-657-transition]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUSTFLAGS: -D warnings
      TEMPER_REQUIRE_CHECKERS: "1"
      TEMPER_ALLOW_MISSING: LuaLS
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Line ends as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@cfcaf53ba4c621917ec7f78a66bff7a8848ddad4 # 1.85.0 branch, 2026-10-16
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-debug
      - name: Toolchains
        uses: ./.github/actions/toolchains
        with:
          backends: py js lua java csharp
      - name: Python
        if: ${{ !cancelled() }}
        run: cargo test --locked -p temper-be-py
      - name: JS
        if: ${{ !cancelled() }}
        run: cargo test --locked -p temper-be-js
      - name: Lua
        if: ${{ !cancelled() }}
        run: cargo test --locked -p temper-be-lua
      - name: Java
        if: ${{ !cancelled() }}
        run: cargo test --locked -p temper-be-java
      - name: C#
        if: ${{ !cancelled() }}
        run: cargo test --locked -p temper-be-csharp
      # The driver's javac argument file and PYTHONUTF8, through the CLI.
      - name: CLI with py, js, java
        if: ${{ !cancelled() }}
        run: cargo test --locked -p tempest --no-default-features --features "net py js java"
        env:
          RUSTFLAGS: ""
