# Every push to main and every pull request, on Linux x64, in four
# parallel jobs after a quick `changes` job, so the run takes about as
# long as its slowest job, not the sum. Each job builds tempest's crates
# from scratch (the cache keeps only third-party crates), so there are
# few jobs, each running many checks, a step each:
#
# - `lint`: formatting, clippy (with and without default features), the
#   workflows parsed as YAML, the docs' links, Temper's functional
#   tests (crates/temper-funtests/cases/) on tempest's interpreter, the
#   size and speed charts, and release tags' rules (release.yml); then
#   `core`'s tests: every crate's but the backends' and `tempest`'s, and
#   again without default features (no backends, no `net`), `tempest`'s
#   included;
# - `cli`: `tempest`'s tests with every backend, so with every
#   toolchain: `tempest test`, `build`, and `run` on small libraries;
# - `backends`, two jobs, each with only its backends' toolchains
#   (.github/actions/toolchains): generated Python run and type checked
#   by mypy and pyright, strict; generated JS run under Node and type
#   checked by TypeScript, strict; generated Lua run by Lua 5.4.6 and by
#   LuaJIT, parsed by luac, and type checked by LuaLS; and generated Rust
#   built, run, and linted by clippy; then generated Java compiled by
#   javac with every lint an error, and run; generated C# compiled by csc
#   with nullable reference types and every warning and .NET analyzer an
#   error, and run; and generated C++ compiled by g++ with every warning
#   an error, and run, also under AddressSanitizer,
#   UndefinedBehaviorSanitizer, and ThreadSanitizer, and compiled at -O2
#   by g++ 12 and 14 (14 at -O3 too) and clang++, every warning an error;
#   and the version's spellings, sorted by each ecosystem's own
#   comparator (npm's, PEP 440's, Maven's, NuGet's, and LuaRocks');
# - `release`: tempest's release build, the VS Code extension (type
#   checked, bundled, packaged, and tested in a real VS Code against
#   that build), the docs' examples on it, and the docs site (built,
#   its Mermaid diagrams drawn, and its links checked); and the wasm
#   build and the playground (type checked, bundled, and smoke tested in
#   headless Chromium).
#
# A change to notes/ alone runs only `lint`; one to docs/ or README.md
# alone, `lint` (with `core`'s steps, for the docs' REPL transcripts)
# and `release`, which test the docs; anything else, everything
# (`changes` says why, and docs/contributing/ci.md). Skipped jobs pass,
# as required checks.
#
# The other platforms tempest is released for (Linux Arm64, macOS
# Arm64, and Windows x64 and Arm64) are tested by nightly.yml. The
# checkers of generated code are at exact versions (.github/ci-tools/);
# nightly.yml also tries each one's latest release. Every action is
# pinned by commit SHA (docs/contributing/ci.md). The checks against
# Kotlin Temper's own lexer and parser need a Kotlin Temper install, so
# they run locally, not here.
#
# Each job is pinned to ubuntu-24.04, not ubuntu-latest, so the packages
# from Ubuntu's archive can't change underneath the tests: noble's
# lua5.4 is 5.4.6, its lua-socket 3.1.0, and its g++ 13. Each caches its
# own build (Swatinem/rust-cache, keyed by job), saved only from main,
# which pull requests read, so their caches don't crowd main's out. The
# jobs whose builds say their version (`cli` and `release`) check out
# the whole history and its tags, so it's a real dev build's
# (`0.7.0-alpha.0.123`), as `tempest --version` and the playground's
# About show.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: nothing here writes to the repository.
permissions:
  contents: read

# A newer push to the same pull request cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What changed, by path, against the pull request's base or the commit
  # before the push, as two outputs, each "true" or "false":
  #
  # - `code`: anything but notes/, docs/, and README.md;
  # - `docs`: `code`, or docs/ or README.md, which `core`'s REPL
  #   transcripts test, and `release`'s docs' examples and docs site.
  #
  # notes/ is read only by `lint` (its links and charts), which always
  # runs. With nothing to compare with (a new branch, or a base that
  # can't be fetched), both are "true". The other jobs check for
  # "false", not "true", so if this job fails they run.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      docs: ${{ steps.diff.outputs.docs }}
    steps:
      # Only .github/ and the top level checked out; the base commit's
      # trees are fetched alone, without history or file contents, which
      # `git diff --name-only` doesn't need.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          docs=true
          if [ -n "${BASE//0/}" ] &&
            git fetch -q --no-tags --depth=1 --filter=blob:none origin "$BASE" &&
            files=$(git diff --no-renames --name-only "$BASE" HEAD); then
            code=false
            docs=false
            while IFS= read -r file; do
              case "$file" in
                "" | notes/*) ;;
                docs/* | README.md) docs=true ;;
                *) code=true; docs=true ;;
              esac
            done <<< "$files"
            echo "Changed since $BASE:"
            printf '%s\n' "$files"
          else
            echo "Nothing to compare with ($BASE), so everything runs."
          fi
          echo "code=$code, docs=$docs"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"

  # Always runs; `core`'s steps only when `docs` is "true" (or unknown).
  lint:
    name: lint, core
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TEMPEST_REQUIRE_CHECKERS: "1"
      CORE: ${{ needs.changes.outputs.docs != 'false' }}
      BACKENDS: >-
        --exclude temper-be-cpp --exclude temper-be-csharp
        --exclude temper-be-java --exclude temper-be-js
        --exclude temper-be-lua --exclude temper-be-py
        --exclude temper-be-rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@cfcaf53ba4c621917ec7f78a66bff7a8848ddad4 # 1.85.0 branch, 2026-10-16
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        # uv itself, checked against its SHA-256 for Linux x64 (from
        # setup-uv's known-checksums.json; docs/contributing/ci.md).
        with:
          version: "0.13.5"
          checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Without backends, as `core` tests `tempest`, and as nightly.yml
      # builds it on the other platforms: helpers only backends' tests
      # use must be gated by `cfg` too.
      - name: Lints without default features
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings
      # GitHub rejects a whole workflow over one bad line, so each must
      # parse, the local action too.
      - name: Workflows parse
        if: ${{ !cancelled() }}
        run: |
          uv run --no-project -q --with pyyaml==6.0.2 python3 -c '
          import sys, yaml
          for f in sys.argv[1:]:
              yaml.safe_load(open(f))
              print("ok", f)
          ' .github/workflows/*.yml .github/actions/*/action.yml
      # Each docs/ and notes/ link leads to a file or heading that
      # exists, and each link to code links a file that defines the item
      # it names.
      - name: Docs' links
        if: ${{ !cancelled() }}
        run: uv run compat/check_anchors.py
      - name: Functional tests
        if: ${{ !cancelled() }}
        run: uv run compat/check_functional.py
      - name: Size and speed charts are current
        if: ${{ !cancelled() }}
        run: uv run compat/size_speed_charts.py --check
      # Which tags release.yml takes (.github/ci-tools/release.py).
      - name: Release tags' rules
        if: ${{ !cancelled() }}
        run: python3 .github/ci-tools/release.py self-test
      # `core`: everything but the backends' crates, which `backends`
      # tests, and `tempest` with backends, which `cli` tests. With the
      # docs' REPL transcripts (temper-frontend's repl_docs).
      - name: Tests
        if: ${{ !cancelled() && env.CORE == 'true' }}
        run: cargo test --locked --workspace $BACKENDS --exclude tempest
      # Without the `net` web client, and `tempest` and `temper-wasm`
      # without their backend features. (The backends' crates have no
      # features, and their tests leave `net` out, so `backends`' runs
      # are the same as theirs here would be.)
      - name: Tests without default features
        if: ${{ !cancelled() && env.CORE == 'true' }}
        run: cargo test --locked --workspace --no-default-features $BACKENDS

  # `tempest`'s own tests with every backend built in, and so every
  # backend's toolchain: `tempest test -b`, `build`, and `run` on small
  # libraries, CMake's build of generated C++, and Kotlin's layout of
  # `temper.out`.
  cli:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # The whole history and the tags, for the version.
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@cfcaf53ba4c621917ec7f78a66bff7a8848ddad4 # 1.85.0 branch, 2026-10-16
        # For `tempest test -b rust`, as the Rust backend's job.
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/toolchains
        with:
          backends: py js lua java csharp cpp rust
      - name: Tests
        run: cargo test --locked -p tempest
        env:
          TEMPEST_REQUIRE_CHECKERS: "1"

  # Each backend's crate, its functional tests running generated code
  # with only its group's toolchains set up (.github/actions/toolchains
  # says why each tool), a step each, so a failure names its backend and
  # doesn't stop the rest. Two groups, about even: the backends checked
  # by checkers (Python, JS, and Lua) with Rust, and the compiled ones
  # (Java, C#, and C++, the slowest), which share the C++ crate's build
  # between its two steps.
  backends:
    name: ${{ matrix.name }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: checked
            name: py, js, lua, rust
            backends: py js lua rust
          - id: compiled
            name: java, csharp, cpp
            backends: java csharp cpp
            apt: g++-12 g++-14 clang
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      TEMPEST_REQUIRE_CHECKERS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@cfcaf53ba4c621917ec7f78a66bff7a8848ddad4 # 1.85.0 branch, 2026-10-16
        # The Rust backend's tests lay out generated crates with
        # rustfmt and lint them with clippy.
        with:
          components: rustfmt, clippy
      # Keyed by the matrix's `id`, as cache keys can't have commas.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.id }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/toolchains
        with:
          backends: ${{ matrix.backends }}
          apt: ${{ matrix.apt }}
      - name: Python
        if: ${{ !cancelled() && contains(matrix.backends, 'py') }}
        run: cargo test --locked -p temper-be-py
      - name: JS
        if: ${{ !cancelled() && contains(matrix.backends, 'js') }}
        run: cargo test --locked -p temper-be-js
      - name: Lua
        if: ${{ !cancelled() && contains(matrix.backends, 'lua') }}
        run: cargo test --locked -p temper-be-lua
      # Generated Lua again under LuaJIT 2.1 (Neovim's and OpenResty's
      # Lua), which has no integers, so temper-core's fallbacks are used.
      # LuaJIT is a rolling release with no binaries: built from a pinned
      # commit of its v2.1 branch.
      - name: Lua under LuaJIT
        if: ${{ !cancelled() && contains(matrix.backends, 'lua') }}
        run: |
          git clone -q https://github.com/LuaJIT/LuaJIT.git "$RUNNER_TEMP/luajit-src"
          git -C "$RUNNER_TEMP/luajit-src" checkout -q 8ca76297
          make -C "$RUNNER_TEMP/luajit-src" -j4 -s PREFIX="$RUNNER_TEMP/luajit"
          make -C "$RUNNER_TEMP/luajit-src" -s install PREFIX="$RUNNER_TEMP/luajit"
          LUA="$RUNNER_TEMP/luajit/bin/luajit" cargo test --locked -p temper-be-lua --test functional runs
      # With the Rust runtime's own unit tests, which the workspace
      # (excluding crates/temper-be-rust/runtime/) leaves out.
      - name: Rust
        if: ${{ !cancelled() && contains(matrix.backends, 'rust') }}
        run: |
          cargo test --locked -p temper-be-rust
          cargo test --locked --manifest-path crates/temper-be-rust/runtime/temper-core/Cargo.toml --target-dir target/rust-runtime
      # Each ecosystem's own comparator sorts temper_tmpl::version's
      # spellings (crates/temper-tmpl/tests/version_order.rs), required
      # here: PEP 440's `packaging` and node-semver at exact versions,
      # into the job's temp directory, not the image; LuaRocks' sources
      # at v3.11.1's commit, run by the Lua 5.4 set up above; and, as
      # they are, the image's Maven (`ComparableVersion`, in its
      # maven-artifact jar) and .NET SDK (NuGet.Versioning).
      - name: Version comparators
        if: ${{ !cancelled() && matrix.id == 'checked' }}
        env:
          TEMPEST_REQUIRE_COMPARATORS: "1"
        run: |
          cmp="$RUNNER_TEMP/comparators"
          uv venv -q "$cmp/py"
          uv pip install -q --python "$cmp/py/bin/python" packaging==25.0
          npm install --prefix "$cmp/npm" --no-save --ignore-scripts --no-audit --no-fund semver@7.7.2
          git clone -q https://github.com/luarocks/luarocks.git "$cmp/luarocks"
          git -C "$cmp/luarocks" checkout -q fa2736e7c68094710643577b0153dac72ce4bcdc
          PYTHON="$cmp/py/bin/python" NODE_SEMVER="$cmp/npm/node_modules/semver" \
            LUAROCKS_MODULES="$cmp/luarocks/src" \
            cargo test --locked -p temper-tmpl --test version_order
      - name: Java
        if: ${{ !cancelled() && contains(matrix.backends, 'java') }}
        run: cargo test --locked -p temper-be-java
      - name: C#
        if: ${{ !cancelled() && contains(matrix.backends, 'csharp') }}
        run: cargo test --locked -p temper-be-csharp
      # All but `strict`, the next step.
      - name: C++
        if: ${{ !cancelled() && contains(matrix.backends, 'cpp') }}
        run: cargo test --locked -p temper-be-cpp -- --exact --skip strict
      # `strict`: all generated C++ built at -O2, every warning an
      # error, as other people's release builds might, by the oldest
      # and newest g++ (the runner's g++ is 13) and clang++, which the
      # container lacks, so only CI checks it.
      - name: C++, strict
        if: ${{ !cancelled() && contains(matrix.backends, 'cpp') }}
        run: cargo test --locked -p temper-be-cpp --test functional -- --exact strict
        env:
          TEMPEST_STRICT_CXX: g++-12 g++-14 clang++

  # tempest's release build (the small profile, as released), and what
  # runs on it; and the wasm build, with every backend, as released, and
  # the playground on it. A step that needs an earlier one's build is
  # skipped when that build fails, so the failure names the build.
  release:
    name: release, playground
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # The whole history and the tags, for the version.
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@cfcaf53ba4c621917ec7f78a66bff7a8848ddad4 # 1.85.0 branch, 2026-10-16
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        # As in `lint`.
        with:
          version: "0.13.5"
          checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: small
        name: Release build of tempest
        run: |
          cargo build --locked --profile small -p tempest
          target/small/tempest --version | tee -a "$GITHUB_STEP_SUMMARY"
      # The VS Code extension, type checked by its pinned tsc and bundled
      # by esbuild, its search for tempest tested under Node, its TextMate
      # grammars checked (check_grammar.py, and test/grammar.mjs with VS
      # Code's own TextMate engine), and packaged by vsce, as a
      # universal .vsix and a Linux x64 one with tempest's release build;
      # that one's tests run in a real VS Code (@vscode/test-electron),
      # under xvfb, against its tempest. VS Code is cached by the version
      # build.py pins (VSCODE_VERSION), so its update servers, which
      # sometimes fail to answer, are needed only when that changes.
      # test/run.ts retries a failed download.
      - id: vscode
        if: ${{ !cancelled() }}
        run: |
          version=$(sed -n 's/^VSCODE_VERSION = "\(.*\)"$/\1/p' editors/vscode/build.py)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: editors/vscode/.vscode-test
          key: vscode-${{ runner.os }}-${{ steps.vscode.outputs.version }}
      - name: VS Code extension
        if: ${{ !cancelled() && steps.small.outcome == 'success' }}
        run: uv run editors/vscode/build.py --tempest target/small/tempest --test
      # Each marked ```temper block in docs/ runs on the release build as its
      # marker says, or as its `<!-- known: In -->` comment says.
      - name: Docs' examples
        if: ${{ !cancelled() && steps.small.outcome == 'success' }}
        run: uv run compat/check_doc_examples.py --tempest target/small/tempest
      # The docs site, as pages.yml builds it, Mermaid diagrams drawn, so
      # a broken link or diagram fails here, not at deploy. Links into the
      # playground are only listed.
      - id: kelpto
        if: ${{ !cancelled() }}
        run: echo "ref=$(tr -d '[:space:]' < site/docs/kelpto-ref)" >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: temperlang/kelpto
          ref: ${{ steps.kelpto.outputs.ref }}
          path: .kelpto
      # The diagram renderer's playwright-core and Chromium, which the
      # playground's smoke test borrows. Not `--with-deps`, which runs
      # apt: the image has Chrome, so Chromium's libraries are there.
      - if: ${{ !cancelled() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('site/docs/mermaid/package-lock.json') }}
      - id: renderer
        name: Diagram renderer
        if: ${{ !cancelled() }}
        working-directory: site/docs/mermaid
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright-core install --only-shell chromium
      - id: docs
        name: Docs site
        if: ${{ !cancelled() && steps.small.outcome == 'success' && steps.renderer.outcome == 'success' }}
        run: uv run site/docs/build.py --kelpto .kelpto --tempest target/small/tempest --out "$RUNNER_TEMP/site"
      - id: wasm
        name: Wasm build
        if: ${{ !cancelled() }}
        run: cargo build --locked --profile small-wasm --target wasm32-unknown-unknown -p temper-wasm
      # The playground's TypeScript, type checked by its pinned tsc, and
      # bundled by esbuild, on the wasm just built.
      - id: playground
        name: Playground
        if: ${{ !cancelled() && steps.wasm.outcome == 'success' }}
        run: uv run site/playground/build.py --skip-wasm
      # The playground in headless Chromium (site/playground/smoke.mjs):
      # each example compiles, fills every backend's tab without errors,
      # and runs, and a hover, a permalink, and the Temper link work; then
      # the REPL tab runs inputs, streams logs, stops, and keeps going;
      # then the shared header, About, the theme, and a phone's menu. With
      # the docs site built, its header must match, and the theme carry.
      - name: Playground smoke test
        if: ${{ !cancelled() && steps.playground.outcome == 'success' && steps.renderer.outcome == 'success' }}
        env:
          SITE: ${{ steps.docs.outcome == 'success' && format('{0}/site', runner.temp) || '' }}
        run: node site/playground/smoke.mjs ${SITE:+--site "$SITE"}
