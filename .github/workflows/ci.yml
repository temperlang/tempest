# Formatting, lints, tests (with and without the `net` web client), the
# wasm build, and Temper's functional tests (copied into vendor/temper/) on
# tempest's interpreter. The checks against Kotlin Temper's own lexer and
# parser need a Kotlin Temper install, so they run locally, not here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Tests without the web client
        run: cargo test --workspace --no-default-features
      - name: Wasm build
        run: cargo build --profile small --target wasm32-unknown-unknown -p temper-wasm
      - uses: astral-sh/setup-uv@v6
      - name: Functional tests
        run: uv run compat/check_functional.py
