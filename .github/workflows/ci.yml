# Formatting, lints, tests (with and without default features, with
# generated Python run and type checked by the latest mypy and pyright,
# strict, generated Rust built, run, and linted by clippy, generated JS
# run under Node and type checked by the latest TypeScript, strict,
# generated Java compiled by javac with every lint an error, and run, and
# generated C# compiled by csc with nullable reference types and every
# warning and .NET analyzer an error, and run, and generated C++ compiled
# by g++ with every warning an error, and run, also under AddressSanitizer,
# UndefinedBehaviorSanitizer, and ThreadSanitizer, and generated Lua run
# by Lua 5.4.6, parsed by luac, and type checked by LuaLS),
# the wasm build and the playground (type checked, bundled, and smoke
# tested in headless Chromium), the VS Code extension (type checked,
# bundled, packaged, and tested in a real VS Code against the release
# build), Temper's functional tests (copied
# into vendor/temper/, which has its patches) on tempest's interpreter, the
# docs' examples on the release build, the docs site (built, its Mermaid
# diagrams drawn, and its links checked), and `tempest test` on Chromarite and Ordable,
# on the interpreter and on Python, JS, Lua, Java, and C#.
# The checks against Kotlin Temper's own lexer and parser need a Kotlin
# Temper install, so they run locally, not here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: astral-sh/setup-uv@v6
      # vendor/temper/ has every patch in vendor/temper-patches/, each
      # listed in its SOURCE.md. Locally, with a Temper checkout, this
      # also compares it file for file with its commit plus the patches.
      - name: Vendored Temper and its patches
        run: uv run compat/sync_temper.py --check
      # Each docs/ link leads to a file or heading that exists, and each
      # link to code links a file that defines the item it names.
      - name: Docs' links
        run: uv run compat/check_anchors.py
      # The Python backend's tests check its output with both, at their
      # latest versions, since they sometimes disagree.
      - name: Type checkers for generated Python
        run: |
          uv tool install mypy
          uv tool install pyright
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      # The Rust backend's tests build generated crates offline against
      # the vendored temper-core; this puts its one dependency, indexmap,
      # at the versions its Cargo.lock pins, in cargo's cache, and the
      # crates generated std depends on (regex), listed in
      # compat/rust-std-deps.
      - name: Crates for generated Rust
        run: |
          cargo fetch --locked --manifest-path vendor/temper/be-rust/temper-core/Cargo.toml
          cargo fetch --locked --manifest-path compat/rust-std-deps/Cargo.toml
      # The JS backend's tests run generated packages under Node and check
      # them with TypeScript's `tsc --checkJs --strict`, at its latest
      # version, and run tests with Mocha 11, as Kotlin's be-js declares.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Type checker for generated JS
        run: npm install --global typescript mocha@^11.1.0
      # The Java backend's tests compile the vendored temper-core and
      # generated Java with javac (the runtime for Java 8, generated code
      # for Java 17, as Kotlin's packages have them) and run it, without
      # Maven; tests that run as tests use JUnit 5.9.2's jars, as
      # Kotlin's pom.xml names them, which Maven puts in its cache.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: JUnit for generated Java's tests
        run: |
          mvn -q dependency:get -Dartifact=org.junit.jupiter:junit-jupiter-engine:5.9.2
          mvn -q dependency:get -Dartifact=org.junit.platform:junit-platform-launcher:1.9.2
      # The C# backend's tests compile the vendored TemperLang.Core and
      # generated C# with Roslyn's csc from the .NET 6 SDK, as Kotlin's
      # projects target .NET 6, and run it, without MSBuild. The restore,
      # of a copy of the runtime's project (so vendor/ stays clean), puts
      # its one dependency, Microsoft.Extensions.Logging 8.0.0, in NuGet's
      # cache, where the tests read it, with MSTest.TestFramework 3.1.1,
      # which std's `testing` and generated tests use, as Kotlin's.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - name: Packages for generated C#
        run: |
          cp -r vendor/temper/be-csharp/temper-core "$RUNNER_TEMP/temper-core"
          dotnet add "$RUNNER_TEMP/temper-core/TemperLang.Core.csproj" package MSTest.TestFramework --version 3.1.1 --no-restore
          dotnet restore "$RUNNER_TEMP/temper-core/TemperLang.Core.csproj"
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # The C++ backend's tests compile the vendored temper-core and
      # generated C++ with the runner's g++ (C++14, as Kotlin's), and run
      # it, also under sanitizers, without CMake. ThreadSanitizer can't
      # place its shadow memory when the kernel randomizes mappings over
      # 32 bits, as Ubuntu 24.04's does; 28, as before, suits it.
      - name: Address randomization for ThreadSanitizer
        run: sudo sysctl vm.mmap_rnd_bits=28
      # libcurl's headers, for std `net`'s default C++ client, so the
      # `netresponse` tests take the libcurl path, as they do locally.
      - name: libcurl for C++'s std net
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      # The Lua backend's tests run generated Lua with the vendored
      # temper-core under Lua 5.4.6 (built from lua.org's source by the
      # action, with luac), the version the tests use locally, and check it
      # with LuaLS's `--check`, at a pinned release.
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4.6"
      # LuaRocks for that Lua, and LuaSocket, std `net`'s default client on
      # Lua, at the versions the tests use locally, so the `netresponse`
      # tests send their requests (without it, they give Kotlin's expected
      # failures). Plain HTTP only: no LuaSec.
      - uses: leafo/gh-actions-luarocks@v4
        with:
          luarocksVersion: "3.11.1"
      - name: LuaSocket
        run: luarocks install luasocket 3.1.0-1
      - name: Type checker for generated Lua
        run: |
          mkdir -p "$RUNNER_TEMP/luals"
          curl -fsSL https://github.com/LuaLS/lua-language-server/releases/download/3.19.2/lua-language-server-3.19.2-linux-x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/luals"
          echo "$RUNNER_TEMP/luals/bin" >> "$GITHUB_PATH"
      - name: Tests
        run: cargo test --workspace
        env:
          TEMPEST_REQUIRE_CHECKERS: "1"
      # The vendored Rust runtime's own unit tests, which the workspace
      # (excluding vendor/) leaves out.
      - name: Vendored Rust runtime's tests
        run: cargo test --locked --manifest-path vendor/temper/be-rust/temper-core/Cargo.toml --target-dir target/vendor-temper-core
      # Generated Lua again under LuaJIT 2.1 (Neovim's and OpenResty's
      # Lua), which has no integers, so temper-core's fallbacks are used.
      # LuaJIT is a rolling release with no binaries: built from a pinned
      # commit of its v2.1 branch.
      - name: Lua tests under LuaJIT
        run: |
          git clone -q https://github.com/LuaJIT/LuaJIT.git "$RUNNER_TEMP/luajit-src"
          git -C "$RUNNER_TEMP/luajit-src" checkout -q 8ca76297
          make -C "$RUNNER_TEMP/luajit-src" -j4 -s PREFIX="$RUNNER_TEMP/luajit"
          make -C "$RUNNER_TEMP/luajit-src" -s install PREFIX="$RUNNER_TEMP/luajit"
          LUA="$RUNNER_TEMP/luajit/bin/luajit" cargo test -p temper-be-lua --test functional runs
        env:
          TEMPEST_REQUIRE_CHECKERS: "1"
      # Without the `net` web client, and `tempest` and `temper-wasm`
      # without their backend features; the backend crates' own tests
      # still run.
      - name: Tests without default features
        run: cargo test --workspace --no-default-features
        env:
          TEMPEST_REQUIRE_CHECKERS: "1"
      # With every backend, as released.
      - name: Wasm build
        run: cargo build --profile small --target wasm32-unknown-unknown -p temper-wasm
      # The playground's TypeScript, type checked by its pinned tsc, and
      # bundled by esbuild, on the wasm just built.
      - name: Playground
        run: uv run site/playground/build.py --skip-wasm
      # The VS Code extension, type checked by its pinned tsc and bundled
      # by esbuild, its search for tempest tested under Node, its TextMate
      # grammars checked (check_grammar.py), and packaged by vsce, as a
      # universal .vsix and a Linux x64 one with tempest's release build
      # (the small profile, as released); that one's tests run in a real
      # VS Code (@vscode/test-electron), under xvfb, against its tempest.
      - name: Release build of tempest
        run: cargo build --profile small -p tempest
      - name: VS Code extension
        run: uv run editors/vscode/build.py --tempest target/small/tempest --test
      # Each marked ```temper block in docs/ runs on the release build as its
      # marker says, or as its `<!-- known: In -->` comment says.
      - name: Docs' examples
        run: uv run compat/check_doc_examples.py --tempest target/small/tempest
      # The docs site, as pages.yml builds it, Mermaid diagrams drawn, so
      # a broken link or diagram fails here, not at deploy. Links into the
      # playground are only listed.
      - id: kelpto
        run: echo "ref=$(tr -d '[:space:]' < site/docs/kelpto-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: temperlang/kelpto
          ref: ${{ steps.kelpto.outputs.ref }}
          path: .kelpto
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('site/docs/mermaid/package-lock.json') }}
      - name: Diagram renderer
        working-directory: site/docs/mermaid
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright-core install --with-deps --only-shell chromium
      # The playground in headless Chromium (site/playground/smoke.mjs),
      # with the diagram renderer's playwright-core and Chromium: each
      # example compiles, fills every backend's tab without errors, and
      # runs, and a hover, a permalink, and the Temper link work.
      - name: Playground smoke test
        run: node site/playground/smoke.mjs
      - name: Docs site
        run: uv run site/docs/build.py --kelpto .kelpto --tempest target/small/tempest --out "$RUNNER_TEMP/site"
      - name: Functional tests
        run: uv run compat/check_functional.py
      - name: Size and speed charts are current
        run: uv run compat/size_speed_charts.py --check
