# Formatting, lints, tests (with and without the `net` web client, and
# with generated Python run and type checked by the latest mypy and
# pyright, strict), the wasm build, Temper's functional tests (copied
# into vendor/temper/) on tempest's interpreter, and `tempest test` on Chromarite and Ordable.
# The checks against Kotlin Temper's own lexer and parser need a Kotlin
# Temper install, so they run locally, not here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: astral-sh/setup-uv@v6
      # The Python backend's tests check its output with both, at their
      # latest versions, since they sometimes disagree.
      - name: Type checkers for generated Python
        run: |
          uv tool install mypy
          uv tool install pyright
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - name: Tests
        run: cargo test --workspace
        env:
          TEMPEST_REQUIRE_CHECKERS: "1"
      - name: Tests without the web client
        run: cargo test --workspace --no-default-features
        env:
          TEMPEST_REQUIRE_CHECKERS: "1"
      - name: Wasm build
        run: cargo build --profile small --target wasm32-unknown-unknown -p temper-wasm
      - name: Functional tests
        run: uv run compat/check_functional.py
      - name: Size and speed charts are current
        run: uv run compat/size_speed_charts.py --check
      # Both are public; if they weren't, checking them out would need a
      # token secret passed as `token:`.
      - uses: actions/checkout@v4
        with:
          repository: temperlang/chromarite
          path: libraries/chromarite
      - uses: actions/checkout@v4
        with:
          repository: temperlang/ordable
          path: libraries/ordable
      # Reuses the functional tests' release build of temper-frontend.
      - name: Library tests
        run: |
          cargo build --release -p tempest
          target/release/tempest test libraries/chromarite
          target/release/tempest test libraries/ordable
