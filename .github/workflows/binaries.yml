# Builds `tempest` for Linux (x64, and Arm64 for 64-bit Raspberry Pi
# OS), macOS (Apple silicon), and Windows (x64 and Arm64), with
# Temper's std built in, `temper-wasm`, and the VS Code extension's
# packages (one per platform with its tempest, and a universal one
# without), and uploads each as a workflow artifact. Pushing a tag
# like `v0.1.0` also attaches them to a GitHub release for that tag. Every
# night, if `main` has changed, and whenever it's run by hand from the
# Actions tab, they replace those of the `nightly` prerelease, whose tag
# moves to the commit built. Linux builds run on Ubuntu 22.04,
# so they need only glibc 2.35, which Debian 12 (and the Raspberry Pi OS
# based on it) has. `run-temper` and the other tools that the compat
# checks use are built from source, so they aren't released.
name: Binaries

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    tags: ["v*"]

# Read-only by default; only the jobs that publish (release, nightly)
# may write, to make releases and move the nightly tag.
permissions:
  contents: read

jobs:
  # Scheduled runs skip the rest when `nightly` already has main's commit.
  changed:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nightly=$(gh api "repos/${{ github.repository }}/commits/nightly" --jq .sha 2>/dev/null || true)
          if [ "${{ github.event_name }}" = schedule ] && [ "$nightly" = "${{ github.sha }}" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            exe: tempest
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            exe: tempest
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: tempest
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: tempest.exe
          # Windows on Arm, cross-compiled on x64; ring (std `net`'s TLS)
          # needs clang for it, which the image has.
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            exe: tempest.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@cfcaf53ba4c621917ec7f78a66bff7a8848ddad4 # 1.85.0 branch, 2026-10-16
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: clang for ring on Windows Arm64
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: bash
        run: echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"
      - name: Build
        run: cargo build --locked --profile small --target ${{ matrix.target }} -p tempest
      - name: Package
        shell: bash
        run: |
          name="tempest-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/small/${{ matrix.exe }}" COPYRIGHT LICENSE-APACHE LICENSE-MIT NOTICE "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tempest-${{ matrix.target }}
          path: tempest-${{ matrix.target }}.*

  wasm:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@cfcaf53ba4c621917ec7f78a66bff7a8848ddad4 # 1.85.0 branch, 2026-10-16
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm32-unknown-unknown
      - name: Build
        run: cargo build --locked --profile small-wasm --target wasm32-unknown-unknown -p temper-wasm
      - name: Package
        run: |
          name="temper-wasm"
          mkdir "$name"
          cp target/wasm32-unknown-unknown/small-wasm/temper_wasm.wasm COPYRIGHT LICENSE-APACHE LICENSE-MIT NOTICE "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: temper-wasm
          path: temper-wasm.tar.gz

  # The VS Code extension: a package per platform, each with the tempest
  # just built for it in bin/, and a universal one without (which finds
  # tempest on PATH), all by `vsce package`; the Linux x64 package's tests
  # run in a real VS Code, under xvfb.
  vscode:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        # uv itself, checked against its SHA-256 for Linux x64 (from
        # setup-uv's known-checksums.json; docs/contributing/ci.md).
        with:
          version: "0.13.5"
          checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tempest-*
          path: dist
          merge-multiple: true
      - name: Unpack the binaries
        run: |
          mkdir bins
          for f in dist/*.tar.gz; do tar xzf "$f" -C bins; done
          for f in dist/*.zip; do unzip -q "$f" -d bins; done
      - name: Package and test
        run: uv run editors/vscode/build.py --binaries bins --test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: temper-vscode
          path: editors/vscode/out/*.vsix

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, wasm, vscode]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            tempest-*
            temper-wasm.tar.gz
            temper-*.vsix

  nightly:
    if: github.event_name != 'push' && github.ref == 'refs/heads/main'
    needs: [build, wasm, vscode]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Move the nightly tag
        run: |
          git tag -f nightly
          git push -f origin nightly
      - name: Replace the nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes 2>/dev/null || true
          gh release create nightly dist/* --prerelease --title "Nightly" \
            --notes "Built from ${{ github.sha }} on $(date -u +%Y-%m-%d). Not a versioned release."
