# Publishes the docs site (site/docs: README.md and docs/, rendered by
# Kelpto) and the playground (site/playground) to GitHub Pages: the docs
# at https://temperlang.github.io/tempest/, the playground at
# playground/ there. Kelpto's commit is in site/docs/kelpto-ref. The
# repository's Pages source must be GitHub Actions (Settings, Pages).
name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - editors/vscode/syntaxes/**
      - editors/vscode/check_grammar.py
      - crates/**
      - lib/**
      - Cargo.lock
      - README.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Only main deploys, even when run by hand from another branch.
    if: github.ref == 'refs/heads/main'
    # Pinned, as ci.yml's jobs, so the image doesn't change underneath.
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@cfcaf53ba4c621917ec7f78a66bff7a8848ddad4 # 1.85.0 branch, 2026-10-16
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        # uv itself, checked against its SHA-256 for Linux x64 (from
        # setup-uv's known-checksums.json; docs/contributing/ci.md).
        with:
          version: "0.13.5"
          checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
      - id: kelpto
        run: echo "ref=$(tr -d '[:space:]' < site/docs/kelpto-ref)" >> "$GITHUB_OUTPUT"
      # Public; built for Python by tempest below.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: temperlang/kelpto
          ref: ${{ steps.kelpto.outputs.ref }}
          path: .kelpto
      # The wasm, npm ci, tsc, and esbuild.
      - name: Playground
        run: uv run site/playground/build.py --out _site/playground
      # README.md and docs/, rendered by Kelpto, which tempest builds for
      # Python. It ends by checking every link on the site, into the
      # playground too, and fails if any is broken. Links to repository
      # files outside docs/ go to GitHub at $GITHUB_SHA, checked against
      # this checkout.
      # Mermaid diagrams are drawn by mermaid in headless Chromium, which
      # the pinned playwright-core installs: its own build, cached by the
      # lockfile (not `--with-deps`, as in ci.yml).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('site/docs/mermaid/package-lock.json') }}
      - name: Diagram renderer
        working-directory: site/docs/mermaid
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright-core install --only-shell chromium
      - name: Docs site
        run: |
          cargo build --locked --release -p tempest
          uv run site/docs/build.py --kelpto .kelpto --out _site
      # Published as built (no Jekyll, as the source is GitHub Actions);
      # upload-pages-artifact leaves out dotfiles.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
