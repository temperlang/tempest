# Generated C++ on more compilers than CI's, every night and whenever
# it's run by hand from the Actions tab: the C++ backend's tests
# (`cargo test -p temper-be-cpp`, as CI runs them, every warning an
# error, with their own AddressSanitizer, UndefinedBehaviorSanitizer,
# and ThreadSanitizer builds) under an older and a newer g++ (12 and
# 14, from Ubuntu's archive if the image lacks them), named by `CXX`,
# and once more with every build but ThreadSanitizer's also under
# AddressSanitizer and UndefinedBehaviorSanitizer, through
# `TEMPER_CXXFLAGS`, so the plain programs and the tests run sanitized
# too. Not clang++: the tests'
# warnings (`STRICT`) are GCC's; ci.yml's `strict` compiles generated C++
# with clang++ too, with clang's.
#
# Also real libraries' tests, as `temper test -b` runs them, on each
# backend each passes on: the libraries are data, listed in
# .github/nightly-libraries.json (name, repository, ref, and backends),
# one job each, so adding one is a line there, not a step here, with
# C#'s and Java's compiler warnings on generated code as failures
# (`TEMPER_STRICT_WARNINGS`); per-push
# CI (ci.yml) tests `temper test` and `build` on small fixtures instead
# (notes/test-speed.md, "Real libraries, nightly").
#
# And an early warning for the checkers of generated code: the backends'
# tests with the latest TypeScript, pyright, mypy, or LuaLS in place of
# the version ci.yml pins, one job each, so a failure names its checker.
#
# And the platforms `temper` is released for but Linux x64, which ci.yml
# tests on every push: Linux Arm64, macOS Arm64, and Windows x64 and
# Arm64, natively: every night, the code that differs by platform
# (`platforms-quick`), and weekly (Sundays), every backend's tests with
# its toolchain too (`platforms`) (docs/contributing/ci.md).
name: Nightly

on:
  workflow_dispatch:
  # The Linux jobs and `platforms-quick` every night, and `platforms`,
  # the longest, weekly. Each job checks which one started the run; run
  # by hand, every job runs.
  schedule:
    - cron: "41 3 * * *"
    - cron: "17 5 * * 0"

# Read-only token: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  # Whether main has changed lately, so a scheduled run skips what an
  # earlier one already tested on the same code: `day`, "true" if its
  # latest commit is under 26 hours old (a day, with room for GitHub's
  # delays in starting scheduled runs), for `cpp` and `platforms-quick`;
  # and `week`, under 8 days, for `platforms`. The jobs check for
  # "false", so if this fails they run. `libraries` and
  # `latest-checkers` run every night regardless: they test other
  # repositories' main branches and the checkers' latest releases.
  recent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      day: ${{ steps.age.outputs.day }}
      week: ${{ steps.age.outputs.week }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github
      - id: age
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          day=false
          week=false
          if [ "$age" -lt $(( 26 * 3600 )) ]; then day=true; fi
          if [ "$age" -lt $(( 8 * 86400 )) ]; then week=true; fi
          echo "Latest commit $(( age / 3600 )) hours old: day=$day, week=$week"
          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "week=$week" >> "$GITHUB_OUTPUT"

  cpp:
    needs: recent
    if: ${{ !cancelled() && (github.event_name != 'schedule' || (github.event.schedule == '41 3 * * *' && needs.recent.outputs.day != 'false')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: g++-12
            cxx: g++-12
          - name: g++-14
            cxx: g++-14
          # As the tests' own ASan build, `maybe-uninitialized` isn't an
          # error: GCC 13 warns of it, wrongly, in libstdc++'s <regex>.
          - name: g++, sanitized
            cxx: g++
            cxxflags: >-
              -fsanitize=address,undefined -fno-sanitize-recover=undefined
              -Wno-error=maybe-uninitialized
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@cfcaf53ba4c621917ec7f78a66bff7a8848ddad4 # 1.85.0 branch, 2026-10-16
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # As in CI, for ThreadSanitizer's shadow memory.
      - name: Address randomization for ThreadSanitizer
        run: sudo sysctl vm.mmap_rnd_bits=28
      # As in CI: libcurl's headers, for std `net`'s default client. And
      # the matrix's g++, which the runner image may not have installed:
      # Ubuntu's package is named as the command (g++-12, g++-14).
      - name: libcurl for C++'s std net, and the compiler
        run: |
          bash .github/ci-tools/apt-install.sh libcurl4-openssl-dev "$CXX"
        env:
          CXX: ${{ matrix.cxx }}
      - name: Tests
        run: |
          "$CXX" --version
          cargo test --locked -p temper-be-cpp
        env:
          CXX: ${{ matrix.cxx }}
          TEMPER_CXXFLAGS: ${{ matrix.cxxflags }}
          # Not `strict` again: ci.yml builds with g++ 12 and 14 and
          # clang++ at -O2 on every push.
          TEMPER_STRICT_CXX: ""
          ASAN_OPTIONS: detect_leaks=0
          TEMPER_REQUIRE_CHECKERS: "1"

  # The list of libraries, as a matrix. When there are many, this is
  # where to shard or rotate them (a slice per night), keeping each job
  # a library and its backends.
  plan:
    if: github.event_name != 'schedule' || github.event.schedule == '41 3 * * *'
    runs-on: ubuntu-latest
    outputs:
      libraries: ${{ steps.list.outputs.libraries }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: list
        run: echo "libraries=$(jq -c . .github/nightly-libraries.json)" >> "$GITHUB_OUTPUT"

  libraries:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        library: ${{ fromJSON(needs.plan.outputs.libraries) }}
    name: ${{ matrix.library.name }}
    # Pinned, as ci.yml's, for Ubuntu's lua5.4, which is 5.4.6 on noble.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@cfcaf53ba4c621917ec7f78a66bff7a8848ddad4 # 1.85.0 branch, 2026-10-16
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Public repositories; a private one would need a token secret
      # passed as `token:`.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ matrix.library.repository }}
          ref: ${{ matrix.library.ref }}
          path: library
      # Each backend's tools, as CI's (ci.yml says why each).
      - name: Crates for generated Rust
        run: |
          cargo fetch --locked --manifest-path crates/temper-be-rust/runtime/temper-core/Cargo.toml
          cargo fetch --locked --manifest-path compat/rust-std-deps/Cargo.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Mocha (with TypeScript and pyright) from CI's lockfile.
      - name: Mocha
        working-directory: .github/ci-tools
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - name: JUnit
        run: |
          mvn -q dependency:get -Dartifact=org.junit.jupiter:junit-jupiter-engine:5.9.2
          mvn -q dependency:get -Dartifact=org.junit.platform:junit-platform-launcher:1.9.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 6.0.x
      # As in ci.yml: libcurl's headers, for C++'s std net, and Lua
      # 5.4.6 from Ubuntu's archive, as `lua`.
      - name: libcurl for C++'s std net, and Lua
        run: |
          bash .github/ci-tools/apt-install.sh libcurl4-openssl-dev lua5.4
          sudo update-alternatives --set lua-interpreter /usr/bin/lua5.4
          lua -v | grep -F "Lua 5.4.6"
      - name: Tests on each backend
        run: |
          cargo build --locked --release -p tempest
          status=0
          for backend in ${{ matrix.library.backends }}; do
            echo "::group::$backend"
            target/release/temper test -b "$backend" library || status=1
            echo "::endgroup::"
          done
          exit $status
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          # C#'s and Java's compiler warnings on generated code fail the
          # tests, as in the backends' own tests.
          TEMPER_STRICT_WARNINGS: "1"

  # Each checker of generated code at its latest release, the others at
  # ci.yml's pins, on the tests of the backend it checks. A failure here
  # blocks nothing; it means that checker's next release finds something
  # in generated code (or the tests need updating) before ci.yml's pin is
  # bumped. The job's name and summary give the versions.
  latest-checkers:
    if: github.event_name != 'schedule' || github.event.schedule == '41 3 * * *'
    strategy:
      fail-fast: false
      matrix:
        include:
          - checker: typescript
            crate: temper-be-js
          - checker: pyright
            crate: temper-be-py
          - checker: mypy
            crate: temper-be-py
          - checker: luals
            crate: temper-be-lua
    name: latest ${{ matrix.checker }}
    # Pinned, as ci.yml's, for Ubuntu's lua5.4, which is 5.4.6 on noble.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@cfcaf53ba4c621917ec7f78a66bff7a8848ddad4 # 1.85.0 branch, 2026-10-16
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        # As in ci.yml.
        with:
          version: "0.13.5"
          checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # As in ci.yml: Lua 5.4.6 and LuaSocket 3.1.0 from Ubuntu's
      # archive, for the Lua backend's tests.
      - if: matrix.crate == 'temper-be-lua'
        name: Lua and LuaSocket
        run: |
          bash .github/ci-tools/apt-install.sh lua5.4 lua-socket
          sudo update-alternatives --set lua-interpreter /usr/bin/lua5.4
          sudo update-alternatives --set lua-compiler /usr/bin/luac5.4
          lua -v | grep -F "Lua 5.4.6"
          luac -v | grep -F "Lua 5.4.6"
          dpkg-query -W -f '${Version}' lua-socket | grep "^3\.1\.0-"
          lua -e "require('socket.http')"
      - id: checkers
        name: Checkers, ${{ matrix.checker }} at its latest
        run: uv run .github/ci-tools/install.py --latest ${{ matrix.checker }}
      - name: Tests
        run: |
          if ! cargo test --locked -p ${{ matrix.crate }} --test functional; then
            echo "::error title=Latest $CHECKER failed::$VERSIONS"
            echo "**Failed** with $CHECKER at its latest release." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
        env:
          CHECKER: ${{ matrix.checker }}
          VERSIONS: ${{ steps.checkers.outputs.versions }}
          TEMPER_REQUIRE_CHECKERS: "1"

  # The platforms binaries.yml releases for but Linux x64, which ci.yml
  # covers on every push, natively, on each OS and architecture's own
  # runner (no Intel macOS binary is built), one job each, in two tiers.
  #
  # Every night, `platforms-quick`: the code that differs by platform,
  # which needs no backend's toolchain: the REPL's (Ctrl-C through
  # SIGINT or the console's handler, ANSI color on Windows' console, and
  # where history is kept) and children.rs's (process groups and time
  # limits; on Windows, only time limits), counted (tests-ran.sh), so a
  # platform where they're all left out fails; and all the CLI's
  # tests, built without backends. A debug build, warnings errors, as
  # clippy only runs on Linux.
  platforms-quick:
    needs: recent
    if: ${{ !cancelled() && (github.event_name != 'schedule' || (github.event.schedule == '41 3 * * *' && needs.recent.outputs.day != 'false')) }}
    name: ${{ matrix.os }}, quick
    strategy:
      fail-fast: false
      matrix:
        # As `platforms`' below.
        os: [ubuntu-24.04-arm, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
    defaults:
      run:
        shell: bash
    steps:
      # As in `platforms`.
      - name: Line ends as committed
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@cfcaf53ba4c621917ec7f78a66bff7a8848ddad4 # 1.85.0 branch, 2026-10-16
        # For the OS calls' lints, on this platform's code.
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.os }}
      - name: clang for ring on Windows Arm64
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        run: echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"
      - name: Build
        run: cargo build --locked -p tempest
      # The OS calls (temper-os) as this platform compiles them, linted
      # (each unsafe block with its safety comment), and the inventory
      # of unsafe code, which push CI checks on Linux only.
      - name: OS calls
        if: ${{ !cancelled() }}
        run: |
          cargo clippy --locked -p temper-os --all-targets -- -D warnings
          cargo test --locked -p temper-os
      # The line editor's, color's, and history's unit tests (on Windows,
      # history's reparse-point check in place of Unix's modes, owners,
      # and links), and `temper repl` as a command: piped input, its
      # flags, color, UTF-8 bytes through unchanged, relative imports,
      # and Ctrl-C: SIGINT on Unix, Ctrl-Break on Windows. The terminal
      # test needs Linux's `script`, so runs on Linux Arm64 too. At
      # least 11 of each: all of them on Windows, so Windows' history
      # and Ctrl-Break tests can't be left out.
      - name: REPL
        if: ${{ !cancelled() }}
        run: |
          bash .github/ci-tools/tests-ran.sh 11 cargo test --locked -p tempest --bin temper repl::
          bash .github/ci-tools/tests-ran.sh 11 cargo test --locked -p tempest --test repl
      # What a session prints, and the docs' transcripts.
      - name: REPL sessions
        if: ${{ !cancelled() }}
        run: bash .github/ci-tools/tests-ran.sh 2 cargo test --locked -p temper-frontend --test repl --test repl_docs
      # Time limits, and on Unix, a command's process group killed.
      - name: Child processes
        if: ${{ !cancelled() }}
        # Quoted: a plain YAML value can't end in a colon.
        run: 'bash .github/ci-tools/tests-ran.sh 2 cargo test --locked -p temper-tmpl --lib children::'
      - name: All of the CLI's tests, without backends
        if: ${{ !cancelled() }}
        run: cargo test --locked -p tempest --no-default-features

  # Weekly, and on demand, `platforms`: the same, then every backend's
  # tests, with its toolchain set up as on Linux
  # (.github/actions/toolchains), and the CLI's with those backends
  # built in, checkers required (TEMPER_REQUIRE_CHECKERS) but for what
  # a platform lacks, which is named (TEMPER_ALLOW_MISSING, or left out
  # of `backends`) and listed in docs/contributing/ci.md. It repeats
  # `platforms-quick`'s steps, which share its build, so every run of
  # either tests the REPL and child processes. One job per platform, so
  # its build is shared by its steps, as macOS and Windows minutes cost
  # more.
  platforms:
    needs: recent
    if: ${{ !cancelled() && (github.event_name != 'schedule' || (github.event.schedule == '17 5 * * 0' && needs.recent.outputs.week != 'false')) }}
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned, as ci.yml's image is, so a new image's change shows up
        # as a bump here. Each is the native runner for one of
        # binaries.yml's targets.
        include:
          # As ci.yml: generated C++ by g++, sanitized, and `strict` by
          # g++ 12 and 14 and clang++.
          - os: ubuntu-24.04-arm
            backends: py js lua java csharp cpp rust
            apt: g++-12 g++-14 clang
            strict-cxx: g++-12 g++-14 clang++
            cpp: cargo test --locked -p temper-be-cpp
          # C++ by Apple's clang through CMake (the CLI's tests); the C++
          # backend's own runs use g++'s options and sanitizers, so are
          # skipped here and on Windows, by name.
          - os: macos-15
            backends: py js lua java csharp cpp rust
            cpp: >-
              cargo test --locked -p temper-be-cpp -- --exact
              --skip runs --skip strict --skip co_await_interop --skip net_client_from_host
          # C++ by MSVC through CMake.
          - os: windows-2025
            backends: py js lua java csharp cpp rust
            cpp: >-
              cargo test --locked -p temper-be-cpp -- --exact
              --skip runs --skip strict --skip co_await_interop --skip net_client_from_host
          # No Lua: the image has no MSYS2, and LuaLS has no Windows
          # Arm64 build.
          - os: windows-11-arm
            backends: py js java csharp cpp rust
            cpp: >-
              cargo test --locked -p temper-be-cpp -- --exact
              --skip runs --skip strict --skip co_await_interop --skip net_client_from_host
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      RUSTFLAGS: -D warnings
      TEMPER_REQUIRE_CHECKERS: "1"
      # LuaLS is checked against a SHA-256 recorded for each platform
      # (.github/ci-tools/install.py), and only Linux x64's is recorded,
      # so the Lua tests' type check is skipped here, with a message.
      TEMPER_ALLOW_MISSING: LuaLS
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    defaults:
      run:
        shell: bash
    steps:
      # Windows images check text files out with CRLF line ends, which
      # the tests' expected output and the docs' transcripts don't have.
      - name: Line ends as committed
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@cfcaf53ba4c621917ec7f78a66bff7a8848ddad4 # 1.85.0 branch, 2026-10-16
        # The Rust backend's tests lay out generated crates with rustfmt
        # and lint them with clippy.
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.os }}
      # ring (std `net`'s TLS) needs clang on Windows Arm64, as in
      # binaries.yml.
      - name: clang for ring on Windows Arm64
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        run: echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"
      - name: Build
        run: cargo build --locked -p tempest
      # The OS calls (temper-os) as this platform compiles them, linted
      # (each unsafe block with its safety comment), and the inventory
      # of unsafe code, which push CI checks on Linux only.
      - name: OS calls
        if: ${{ !cancelled() }}
        run: |
          cargo clippy --locked -p temper-os --all-targets -- -D warnings
          cargo test --locked -p temper-os
      # The line editor's, color's, and history's unit tests (on Windows,
      # history's reparse-point check in place of Unix's modes, owners,
      # and links), and `temper repl` as a command: piped input, its
      # flags, color, UTF-8 bytes through unchanged, relative imports,
      # and Ctrl-C: SIGINT on Unix, Ctrl-Break on Windows. The terminal
      # test needs Linux's `script`, so runs on Linux Arm64 too. At
      # least 11 of each: all of them on Windows, so Windows' history
      # and Ctrl-Break tests can't be left out.
      - name: REPL
        if: ${{ !cancelled() }}
        run: |
          bash .github/ci-tools/tests-ran.sh 11 cargo test --locked -p tempest --bin temper repl::
          bash .github/ci-tools/tests-ran.sh 11 cargo test --locked -p tempest --test repl
      # What a session prints, and the docs' transcripts.
      - name: REPL sessions
        if: ${{ !cancelled() }}
        run: bash .github/ci-tools/tests-ran.sh 2 cargo test --locked -p temper-frontend --test repl --test repl_docs
      # Time limits, and on Unix, a command's process group killed.
      - name: Child processes
        if: ${{ !cancelled() }}
        # Quoted: a plain YAML value can't end in a colon.
        run: 'bash .github/ci-tools/tests-ran.sh 2 cargo test --locked -p temper-tmpl --lib children::'
      - name: All of the CLI's tests, without backends
        if: ${{ !cancelled() }}
        run: cargo test --locked -p tempest --no-default-features
      - name: Toolchains
        if: ${{ !cancelled() }}
        uses: ./.github/actions/toolchains
        with:
          backends: ${{ matrix.backends }}
          apt: ${{ matrix.apt }}
      # Each backend's tests, a step each, so a failure names its
      # backend, and one failing doesn't stop the rest.
      - name: Python
        if: ${{ !cancelled() && contains(matrix.backends, 'py') }}
        run: cargo test --locked -p temper-be-py
      - name: JS
        if: ${{ !cancelled() && contains(matrix.backends, 'js') }}
        run: cargo test --locked -p temper-be-js
      - name: Lua
        if: ${{ !cancelled() && contains(matrix.backends, 'lua') }}
        run: cargo test --locked -p temper-be-lua
      - name: Java
        if: ${{ !cancelled() && contains(matrix.backends, 'java') }}
        run: cargo test --locked -p temper-be-java
      - name: C#
        if: ${{ !cancelled() && contains(matrix.backends, 'csharp') }}
        run: cargo test --locked -p temper-be-csharp
      - name: Rust
        if: ${{ !cancelled() && contains(matrix.backends, 'rust') }}
        run: |
          cargo test --locked -p temper-be-rust
          cargo test --locked --manifest-path crates/temper-be-rust/runtime/temper-core/Cargo.toml --target-dir target/rust-runtime
      - name: C++
        if: ${{ !cancelled() && contains(matrix.backends, 'cpp') }}
        run: ${{ matrix.cpp }}
        env:
          TEMPER_STRICT_CXX: ${{ matrix.strict-cxx }}
      # The CLI's tests with this platform's backends built in:
      # `temper test -b`, `build`, and `run` on small libraries, and
      # CMake's build of generated C++. Without RUSTFLAGS, as on Linux,
      # since `temper test -b rust` runs cargo on generated crates, which
      # would take them too; so `temper` is built again here.
      - name: All of the CLI's tests, with this platform's backends
        if: ${{ !cancelled() }}
        run: cargo test --locked -p tempest --no-default-features --features "net $BACKENDS"
        env:
          BACKENDS: ${{ matrix.backends }}
          RUSTFLAGS: ""
