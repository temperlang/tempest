[package]
name = "tempest"
description = "The tempest command, Temper's CLI over the other crates: argument parsing and output"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

# Each backend is a feature, all on by default (temper-driver's), so a
# smaller build can leave some out; `tempest build -b js` and such then
# say it wasn't built in. `net` is temper-frontend's web client for std `net`.
[features]
default = ["net", "py", "rust", "js", "java", "csharp", "cpp", "lua"]
net = ["temper-frontend/net"]
py = ["temper-driver/py"]
rust = ["temper-driver/rust"]
js = ["temper-driver/js"]
java = ["temper-driver/java"]
csharp = ["temper-driver/csharp"]
cpp = ["temper-driver/cpp"]
lua = ["temper-driver/lua"]

[dependencies]
# Line editing for `tempest repl` on a terminal (history, multi-line
# input, completion, highlighting).
# History is kept in memory only; tempest reads and writes its file
# itself, through one checked descriptor (src/repl/history.rs).
rustyline = { version = "17.0.2", default-features = false, features = ["custom-bindings"] }
temper-analysis = { path = "../temper-analysis" }
temper-driver = { path = "../temper-driver", default-features = false }
temper-frontend = { path = "../temper-frontend", default-features = false }
temper-lsp = { path = "../temper-lsp" }
# The REPL's Ctrl-C handler, the console, and the history file's checked
# opening: the OS calls, each behind a safe function.
temper-os = { path = "../temper-os" }
temper-syntax = { path = "../temper-syntax" }
temper-tmpl = { path = "../temper-tmpl" }

# The flags for the history file's checked opening (`O_NOFOLLOW`), whose
# calls are temper-os's; already in the build, through rustyline.
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
# Reads `cargo metadata`, to keep `tempest licenses` current
# (tests/licenses.rs); already in the workspace, for temper-lsp.
serde_json = "1"
temper-be-testkit = { path = "../temper-be-testkit" }
temper-funtests = { path = "../temper-funtests" }
