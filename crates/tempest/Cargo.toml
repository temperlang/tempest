[package]
name = "tempest"
description = "The tempest command: Temper's CLI over the other crates"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

# Each backend is a feature, all on by default, so a smaller build can
# leave some out; `tempest js` and such then say it wasn't built in.
# `net` is temper-frontend's web client for std `net`.
[features]
default = ["net", "py", "rust", "js", "java", "csharp"]
net = ["temper-frontend/net"]
py = ["dep:temper-be-py"]
rust = ["dep:temper-be-rust"]
js = ["dep:temper-be-js"]
java = ["dep:temper-be-java"]
csharp = ["dep:temper-be-csharp"]

[dependencies]
temper-be-csharp = { path = "../temper-be-csharp", optional = true }
temper-be-java = { path = "../temper-be-java", optional = true }
temper-be-js = { path = "../temper-be-js", optional = true }
temper-be-py = { path = "../temper-be-py", optional = true }
temper-be-rust = { path = "../temper-be-rust", optional = true }
temper-frontend = { path = "../temper-frontend", default-features = false }
temper-syntax = { path = "../temper-syntax" }
temper-tmpl = { path = "../temper-tmpl" }
