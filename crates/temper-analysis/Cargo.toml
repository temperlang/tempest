[package]
name = "temper-analysis"
description = "Editor queries over a settled Temper library: diagnostics, hover, definition, and completion"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Without `net`, as only the frontend's analysis is needed; dependents
# turn it on through their own temper-frontend dependency if they like.
temper-frontend = { path = "../temper-frontend", default-features = false }
temper-syntax = { path = "../temper-syntax" }

