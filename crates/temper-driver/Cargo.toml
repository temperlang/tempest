[package]
name = "temper-driver"
description = "What tools share over the backends: their registry, the one compile path, and running tests with each language's tools"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

# Each backend is a feature, all on by default, so a smaller build can
# leave some out; the registry then lacks it, and says so by name.
[features]
default = ["py", "rust", "js", "java", "csharp", "cpp", "lua"]
py = ["dep:temper-be-py"]
rust = ["dep:temper-be-rust"]
js = ["dep:temper-be-js"]
java = ["dep:temper-be-java"]
csharp = ["dep:temper-be-csharp"]
cpp = ["dep:temper-be-cpp"]
lua = ["dep:temper-be-lua"]

[dependencies]
# Hover's text for the REPL's `help` (src/repl.rs).
temper-analysis = { path = "../temper-analysis" }
temper-be-cpp = { path = "../temper-be-cpp", optional = true }
temper-be-csharp = { path = "../temper-be-csharp", optional = true }
temper-be-java = { path = "../temper-be-java", optional = true }
temper-be-js = { path = "../temper-be-js", optional = true }
temper-be-lua = { path = "../temper-be-lua", optional = true }
temper-be-py = { path = "../temper-be-py", optional = true }
temper-be-rust = { path = "../temper-be-rust", optional = true }
temper-frontend = { path = "../temper-frontend", default-features = false }
temper-tmpl = { path = "../temper-tmpl" }

[dev-dependencies]
# The case files' reader (temper-syntax's tests/common), for tests/repl.rs.
temper-syntax = { path = "../temper-syntax" }
