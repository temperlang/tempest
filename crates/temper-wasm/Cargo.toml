[package]
name = "temper-wasm"
description = "Temper in the browser: a small wasm entry point, the seed of a playground"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Each backend is a feature, all on by default, as in `tempest`, so a
# smaller build can leave some out; `generate` then says so.
[features]
default = ["py", "rust", "js"]
py = ["dep:temper-be-py", "dep:temper-tmpl"]
rust = ["dep:temper-be-rust", "dep:temper-tmpl"]
js = ["dep:temper-be-js", "dep:temper-tmpl"]

[dependencies]
temper-be-js = { path = "../temper-be-js", optional = true }
temper-be-py = { path = "../temper-be-py", optional = true }
temper-be-rust = { path = "../temper-be-rust", optional = true }
# Without `net`: std `net` requests fail with "web client not supported here".
temper-frontend = { path = "../temper-frontend", default-features = false }
temper-syntax = { path = "../temper-syntax" }
temper-tmpl = { path = "../temper-tmpl", optional = true }

[dev-dependencies]
temper-funtests = { path = "../temper-funtests" }
