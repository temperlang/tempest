[package]
name = "temper-wasm"
description = "Temper in the browser: the wasm entry point of the web playground"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Each backend is a feature, all on by default, as in `tempest`, whose
# library compiles for it, so a smaller build can leave some out;
# `generate` then says so.
[features]
default = ["py", "rust", "js", "java", "csharp", "cpp", "lua"]
py = ["tempest/py"]
rust = ["tempest/rust"]
js = ["tempest/js"]
java = ["tempest/java"]
csharp = ["tempest/csharp"]
cpp = ["tempest/cpp"]
lua = ["tempest/lua"]

[dependencies]
# Without `net`: std `net` requests fail with "web client not supported here".
temper-frontend = { path = "../temper-frontend", default-features = false }
temper-syntax = { path = "../temper-syntax" }
temper-tmpl = { path = "../temper-tmpl" }
tempest = { path = "../tempest", default-features = false }

[dev-dependencies]
temper-be-testkit = { path = "../temper-be-testkit" }
temper-funtests = { path = "../temper-funtests" }
