[package]
name = "temper-wasm"
description = "Temper in the browser: the wasm entry point of the web playground"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Each backend is a feature, all on by default, as in `temper-driver`,
# whose compile path it takes, so a smaller build can leave some out;
# `generate` then says so.
[features]
default = ["py", "rust", "js", "java", "csharp", "cpp", "lua"]
py = ["temper-driver/py"]
rust = ["temper-driver/rust"]
js = ["temper-driver/js"]
java = ["temper-driver/java"]
csharp = ["temper-driver/csharp"]
cpp = ["temper-driver/cpp"]
lua = ["temper-driver/lua"]

[dependencies]
# Without `net`: std `net` requests fail with "web client not supported here".
temper-frontend = { path = "../temper-frontend", default-features = false }
temper-analysis = { path = "../temper-analysis" }
temper-syntax = { path = "../temper-syntax" }
temper-tmpl = { path = "../temper-tmpl" }
temper-driver = { path = "../temper-driver", default-features = false }

[dev-dependencies]
serde_json = "1"
temper-be-testkit = { path = "../temper-be-testkit" }
temper-funtests = { path = "../temper-funtests" }
