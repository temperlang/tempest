[package]
name = "temper-be-testkit"
description = "What the backends' tests share: programs, tmpl from Temper, goldens, tools, and cached runtimes"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

# Only the backends' tests use it, as a dev-dependency; it knows no
# backend.
[dependencies]
temper-frontend = { path = "../temper-frontend", default-features = false }
temper-funtests = { path = "../temper-funtests" }
temper-tmpl = { path = "../temper-tmpl" }

# The interpreter's web client, for std `net`'s tests on the interpreter
# (`tests/programs.rs`); the backends' tests leave it out.
[dev-dependencies]
temper-frontend = { path = "../temper-frontend", default-features = false, features = ["net"] }
