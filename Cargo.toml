[workspace]
resolver = "3"
members = ["crates/*"]
# The Rust backend's runtime (`temper-core`, with its own Cargo.lock)
# builds on its own, as generated crates use it. `library` is where the
# nightly workflow checks out a Temper library, so its generated crates
# build on their own.
exclude = ["crates/temper-be-rust/runtime", "library"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
# The next release's version; builds between releases are 0.7.0-alpha.0.N,
# N commits since the last `v` tag (docs/internals/detail/06-backends.md).
version = "0.7.0"
publish = false
license = "Apache-2.0 OR MIT"

# No unsafe code, and no crate can allow it: the OS calls std lacks are
# `temper-os`'s, each behind a safe function, and only it and
# `temper-wasm` (for its exports' `#[unsafe(no_mangle)]`) have lints of
# their own. `temper-os`'s tests/unsafe_inventory.rs counts what's left.
[workspace.lints.rust]
unsafe_code = "forbid"

# For tracking binary size (compat/measure_size.py) and for what's released
# (temper and the VS Code packages): optimize for size, link everything
# together, and strip. Benchmarks use the plain release profile.
#
# Panics unwind, as in release, so the language server and the CLI can
# catch one (catch_unwind) and go on or report it, rather than the process
# aborting; that adds about 12% to temper.
[profile.small]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "unwind"
strip = true

# The playground's wasm (temper-wasm for wasm32-unknown-unknown): small,
# aborting on panic, as wasm32-unknown-unknown can't unwind (the page makes
# a fresh instance after a trap). Profiles can't differ by target, so it has
# its own; asking wasm to unwind builds, but changes its code.
[profile.small-wasm]
inherits = "small"
panic = "abort"
