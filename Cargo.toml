[workspace]
resolver = "3"
members = ["crates/*"]
# Vendored runtimes (Rust's `temper-core`) build only with generated code.
# `library` is where the nightly workflow checks out a Temper library, so
# its generated crates build on their own.
exclude = ["vendor", "library"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.0.0"
publish = false
license = "Apache-2.0 OR MIT"

# For tracking binary size (compat/measure_size.py) and for what's released
# (tempest and the VS Code packages): optimize for size, link everything
# together, and strip. Benchmarks use the plain release profile.
#
# Panics unwind, as in release, so the language server and the CLI can
# catch one (catch_unwind) and go on or report it, rather than the process
# aborting; that adds about 12% to tempest.
[profile.small]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "unwind"
strip = true

# The playground's wasm (temper-wasm for wasm32-unknown-unknown): small,
# aborting on panic, as wasm32-unknown-unknown can't unwind (the page makes
# a fresh instance after a trap). Profiles can't differ by target, so it has
# its own; asking wasm to unwind builds, but changes its code.
[profile.small-wasm]
inherits = "small"
panic = "abort"
