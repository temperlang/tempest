[workspace]
resolver = "3"
members = ["crates/*"]
# Vendored runtimes (Rust's `temper-core`) build only with generated code.
# `library` is where the nightly workflow checks out a Temper library, so
# its generated crates build on their own.
exclude = ["vendor", "library"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.0.0"
publish = false
license = "Apache-2.0 OR MIT"

# For tracking binary size (compat/measure_size.py): optimize for size, link
# everything together, and strip. Benchmarks use the plain release profile.
[profile.small]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
